# believe: build manual del .exe de Windows para distribución interna (sin firma; SmartScreen one-time)
name: believe-windows-build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'pnpm'
          cache-dependency-path: 'apps/x/pnpm-lock.yaml'

      - name: Install dependencies
        shell: bash
        run: |
          cd apps/x
          pnpm install --frozen-lockfile

      - name: Make Windows installer
        shell: bash
        run: |
          cd apps/x/apps/main
          npx electron-forge make --arch=x64 --platform=win32

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: distributables-windows
          path: |
            apps/x/apps/main/out/make/**/*.exe
            apps/x/apps/main/out/make/**/*.nupkg
          retention-days: 14
